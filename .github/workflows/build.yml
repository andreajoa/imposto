name: Build verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test checkout
        run: node --test tests/checkout.test.js
      - name: Build Vite app
        run: npm run build
      - name: Validate SEO output
        run: node --test tests/seo.test.js
      - name: Validate serverless checkout modules
        run: |
          node --input-type=module <<'EOF'
          const modules = [
            './api/stripe-config.js',
            './api/catalog.js',
            './api/checkout.js',
            './api/session-status.js',
            './api/contact.js',
          ]
          for (const file of modules) {
            const mod = await import(file)
            if (typeof mod.default !== 'function') {
              throw new Error(`${file} is missing a Vercel default handler`)
            }
          }
          console.log('Vercel serverless modules validated')
          EOF
