name: Live production smoke

on:
  push:
    branches:
      - automation/live-smoke-20260914

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify published site
        env:
          BASE_URL: https://www.express-solution.com
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const base = process.env.BASE_URL.replace(/\/$/, '');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
            const page = await context.newPage();
            const report = {};

            try {
              const nav = await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 60000 });
              assert(nav && nav.ok(), `Homepage HTTP ${nav && nav.status()}`);
              report.finalUrl = page.url();
              report.title = await page.title();

              const bodyText = await page.locator('body').innerText();
              assert(!/checkout indispon[ií]vel/i.test(bodyText), 'Homepage contains Checkout indisponível');

              const cartButtons = await page.getByRole('button', { name: /carrinho|ver carrinho|ir para o carrinho/i }).count();
              assert(cartButtons === 0, `Found ${cartButtons} cart button(s)`);
              report.cartButtons = cartButtons;

              const heroCover = page.locator('.tg-hero-product img[src*="tax-guide-cover.png"]');
              await heroCover.waitFor({ state: 'visible', timeout: 20000 });
              const heroCoverOk = await heroCover.evaluate(img => img.complete && img.naturalWidth > 100 && img.naturalHeight > 100);
              assert(heroCoverOk, 'Hero official cover did not load');

              await page.locator('#comprar').scrollIntoViewIfNeeded();
              const offerCover = page.locator('.tg-offer-visual img[src*="tax-guide-cover.png"]');
              await offerCover.waitFor({ state: 'visible', timeout: 20000 });
              const offerCoverOk = await offerCover.evaluate(img => img.complete && img.naturalWidth > 100 && img.naturalHeight > 100);
              assert(offerCoverOk, 'Offer official cover did not load');
              report.officialCover = { hero: heroCoverOk, offer: offerCoverOk, count: await page.locator('img[src*="tax-guide-cover.png"]').count() };

              await page.locator('#topo').scrollIntoViewIfNeeded();
              const checkoutResponsePromise = page.waitForResponse(
                r => r.url().includes('/api/checkout') && r.request().method() === 'POST',
                { timeout: 60000 }
              );

              await page.getByRole('button', { name: /Quero o guia completo/i }).click();
              await page.locator('.embedded-checkout-overlay').waitFor({ state: 'visible', timeout: 10000 });

              const checkoutResponse = await checkoutResponsePromise;
              const checkoutPayload = await checkoutResponse.json().catch(() => ({}));
              assert(checkoutResponse.status() === 200, `Checkout API HTTP ${checkoutResponse.status()}: ${JSON.stringify(checkoutPayload)}`);
              assert(typeof checkoutPayload.clientSecret === 'string' && checkoutPayload.clientSecret.includes('_secret_'), 'Checkout API did not return a Stripe clientSecret');
              report.checkoutApiStatus = checkoutResponse.status();

              await page.waitForTimeout(6000);
              const overlayText = await page.locator('.embedded-checkout-overlay').innerText();
              assert(!/checkout indispon[ií]vel/i.test(overlayText), 'Checkout overlay contains Checkout indisponível');
              assert(!/n[aã]o foi poss[ií]vel abrir o pagamento/i.test(overlayText), `Embedded checkout error: ${overlayText}`);
              const mountHtmlLength = await page.locator('.embedded-stripe-mount').evaluate(el => el.innerHTML.length);
              assert(mountHtmlLength > 0, 'Stripe Embedded Checkout did not mount any content');
              const stripeIframeCount = await page.locator('.embedded-stripe-mount iframe').count();
              report.embeddedCheckout = { mounted: true, iframeCount: stripeIframeCount, mountHtmlLength };

              const clientSecret = checkoutPayload.clientSecret;
              const sessionId = clientSecret.split('_secret_')[0];
              assert(sessionId.startsWith('cs_'), 'Could not derive Checkout Session ID from clientSecret');

              const statusResponse = await context.request.get(`${base}/api/session-status?session_id=${encodeURIComponent(sessionId)}`);
              const statusPayload = await statusResponse.json().catch(() => ({}));
              assert(statusResponse.status() === 200, `session-status HTTP ${statusResponse.status()}: ${JSON.stringify(statusPayload)}`);
              assert(statusPayload.paid === false, 'Fresh unpaid smoke-test session unexpectedly reports paid');
              assert(Array.isArray(statusPayload.products) && statusPayload.products.length >= 1, 'session-status returned no products');
              assert(statusPayload.products.every(p => !p.downloadUrl), 'Unpaid session exposed a downloadUrl');
              report.unpaidGate = { paid: statusPayload.paid, products: statusPayload.products.map(p => ({ id: p.id, hasDownloadUrl: Boolean(p.downloadUrl) })) };

              const thankYou = await page.goto(`${base}/obrigado?session_id=${encodeURIComponent(sessionId)}`, { waitUntil: 'networkidle', timeout: 60000 });
              assert(thankYou && thankYou.ok(), `Thank-you page HTTP ${thankYou && thankYou.status()}`);
              const thankText = await page.locator('body').innerText();
              assert(/pagamento em processamento/i.test(thankText), `Expected pending payment state, got: ${thankText.slice(0, 500)}`);
              assert(await page.getByRole('link', { name: /Abrir PDF online/i }).count() === 0, 'Unpaid session exposes Abrir PDF online');
              assert(await page.getByRole('button', { name: /Baixar PDF/i }).count() === 0, 'Unpaid session exposes Baixar PDF');
              report.thankYouGate = { pendingShown: true, openPdfVisible: false, downloadPdfVisible: false };

              console.log('LIVE_SMOKE_RESULT=' + JSON.stringify(report));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error('LIVE_SMOKE_FAILURE=' + (error && error.stack ? error.stack : error));
            process.exit(1);
          });
          NODE
