<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420" role="img" aria-labelledby="title desc">
  <title id="title">Abertura de Empresa nos EUA</title>
  <desc id="desc">Capa do guia de Kelly Moraes, Express Solution Tax &amp; Accounting, Inc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#434242"/>
      <stop offset=".72" stop-color="#2D2D2D"/>
      <stop offset="1" stop-color="#393735"/>
    </linearGradient>
    <clipPath id="photo"><rect x="166" y="210" width="104" height="142" rx="16"/></clipPath>
  </defs>
  <rect width="300" height="420" rx="8" fill="url(#bg)"/>
  <g fill="#F7F3ED" text-anchor="middle">
    <line x1="92" y1="36" x2="208" y2="36" stroke="#EBE7E2" stroke-width="2"/>
    <line x1="108" y1="44" x2="192" y2="44" stroke="#EBE7E2" stroke-width="1"/>
    <text x="150" y="72" font-family="Georgia,serif" font-style="italic" font-size="25">Express Solution</text>
    <text x="150" y="91" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.2">TAX &amp; ACCOUNTING, INC.</text>
  </g>
  <g fill="#EBE7E2" font-family="Georgia,serif" font-weight="700">
    <text x="28" y="155" font-size="35">Abertura de</text>
    <text x="28" y="195" font-size="35">Empresa nos EUA</text>
  </g>
  <text x="28" y="228" fill="#C7C5C3" font-family="Arial,sans-serif" font-size="11">
    <tspan x="28" dy="0">Guia prático para escolher a estrutura certa,</tspan>
    <tspan x="28" dy="16">organizar a abertura e entender responsabilidades</tspan>
    <tspan x="28" dy="16">fiscais com mais clareza.</tspan>
  </text>
  <image href="/image/autora.png" x="166" y="210" width="104" height="142" preserveAspectRatio="xMidYMin slice" clip-path="url(#photo)"/>
  <rect x="166" y="210" width="104" height="142" rx="16" fill="none" stroke="#948A85" stroke-width="2"/>
  <text x="28" y="374" fill="#F7F3ED" font-family="Georgia,serif" font-size="18" font-weight="700">Kelly Moraes</text>
  <text x="28" y="394" fill="#C7C5C3" font-family="Arial,sans-serif" font-size="7.5" letter-spacing=".6">EXPRESS SOLUTION TAX &amp; ACCOUNTING, INC.</text>
</svg>
