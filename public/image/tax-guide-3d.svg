<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1320" role="img" aria-labelledby="title desc">
  <title id="title">Guia Completo de Impostos para Imigrantes nos EUA</title>
  <desc id="desc">Mockup 3D premium em grafite, marfim e taupe da Express Solution.</desc>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d4b49"/>
      <stop offset=".55" stop-color="#3d3b3a"/>
      <stop offset="1" stop-color="#292827"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171716"/>
      <stop offset=".55" stop-color="#2d2d2c"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset=".65" stop-color="#e9e1d8"/>
      <stop offset="1" stop-color="#cbbfb2"/>
    </linearGradient>
    <linearGradient id="taupe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7c7b6"/>
      <stop offset=".55" stop-color="#a99683"/>
      <stop offset="1" stop-color="#eee5dc"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="200%" height="210%">
      <feDropShadow dx="28" dy="34" stdDeviation="30" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <filter id="floor" x="-60%" y="-100%" width="220%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <ellipse cx="520" cy="1194" rx="330" ry="48" fill="#000" opacity=".22" filter="url(#floor)"/>

  <g filter="url(#shadow)" transform="rotate(-1.1 500 650)">
    <path d="M248 68 L858 91 L907 63 L303 41 Z" fill="url(#pages)"/>
    <path d="M857 91 L907 63 L906 1115 L856 1143 Z" fill="url(#pages)"/>
    <path d="M127 101 Q135 72 168 67 L249 77 L249 1141 L171 1154 Q137 1155 127 1117 Z" fill="url(#spine)"/>
    <path d="M171 67 Q198 62 249 77 L249 1141 Q204 1153 171 1154 Q192 1134 193 1094 L193 124 Q191 87 171 67Z" fill="#0b0b0b" opacity=".28"/>

    <rect x="226" y="77" width="632" height="1066" rx="18" fill="url(#front)" stroke="#625f5b" stroke-width="2"/>
    <rect x="239" y="91" width="606" height="1038" rx="13" fill="none" stroke="#ffffff" stroke-opacity=".05"/>

    <g text-anchor="middle">
      <path d="M406 139 H681 M428 155 H659" stroke="#f7f3ed" stroke-width="3"/>
      <text x="544" y="218" fill="#f7f3ed" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="61">Express Solution</text>
      <path d="M438 239 H650 M458 254 H630" stroke="#ebe7e2" stroke-width="2" opacity=".9"/>
      <text x="544" y="285" fill="#ded3c6" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2.2">TAX &amp; ACCOUNTING, INC.</text>
    </g>

    <text x="290" y="402" fill="#f7f3ed" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">
      <tspan x="290" dy="0">Guia Completo de</tspan>
      <tspan x="290" dy="76">Impostos para</tspan>
      <tspan x="290" dy="76">Imigrantes nos EUA</tspan>
    </text>

    <rect x="291" y="608" width="96" height="7" rx="4" fill="url(#taupe)"/>

    <text x="291" y="660" fill="#e8e0d8" font-family="Arial, Helvetica, sans-serif" font-size="22">
      <tspan x="291" dy="0">Entenda documentos, rendas, créditos, deduções</tspan>
      <tspan x="291" dy="34">e organize sua vida fiscal com mais clareza.</tspan>
    </text>

    <g transform="translate(292 770)" font-family="Arial, Helvetica, sans-serif">
      <g>
        <circle cx="31" cy="31" r="31" fill="#ded3c6"/>
        <text x="31" y="40" text-anchor="middle" fill="#343231" font-size="24" font-weight="700">01</text>
        <text x="82" y="26" fill="#f7f3ed" font-size="19" font-weight="700" letter-spacing="1">PASSO A PASSO</text>
        <text x="82" y="50" fill="#c7c5c3" font-size="16">conceitos explicados em português claro</text>
      </g>
      <g transform="translate(0 96)">
        <circle cx="31" cy="31" r="31" fill="#ded3c6"/>
        <text x="31" y="40" text-anchor="middle" fill="#343231" font-size="24" font-weight="700">02</text>
        <text x="82" y="26" fill="#f7f3ed" font-size="19" font-weight="700" letter-spacing="1">FERRAMENTAS PRÁTICAS</text>
        <text x="82" y="50" fill="#c7c5c3" font-size="16">checklists, controles e organização anual</text>
      </g>
      <g transform="translate(0 192)">
        <circle cx="31" cy="31" r="31" fill="#ded3c6"/>
        <text x="31" y="40" text-anchor="middle" fill="#343231" font-size="24" font-weight="700">03</text>
        <text x="82" y="26" fill="#f7f3ed" font-size="19" font-weight="700" letter-spacing="1">MAIS SEGURANÇA</text>
        <text x="82" y="50" fill="#c7c5c3" font-size="16">para organizar informações e fazer perguntas melhores</text>
      </g>
    </g>

    <g transform="translate(650 756)">
      <rect x="0" y="0" width="150" height="215" rx="24" fill="#ebe7e2" stroke="#b9aa9b" stroke-width="3"/>
      <circle cx="75" cy="76" r="42" fill="#a99683" opacity=".42"/>
      <circle cx="75" cy="68" r="28" fill="#4d4b49"/>
      <path d="M35 168 Q75 108 115 168 V186 H35Z" fill="#4d4b49"/>
      <text x="75" y="204" text-anchor="middle" fill="#4d4b49" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">KELLY MORAES</text>
    </g>

    <text x="292" y="1090" fill="#f7f3ed" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">Kelly Moraes</text>
    <text x="292" y="1122" fill="#c7c5c3" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2">EXPRESS SOLUTION TAX &amp; ACCOUNTING, INC.</text>

    <text transform="translate(169 805) rotate(-90)" fill="#ebe7e2" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Guia de Impostos para Imigrantes nos EUA</text>
  </g>
</svg>
