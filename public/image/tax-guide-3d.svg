<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1320" role="img" aria-labelledby="title desc">
  <title id="title">Guia Completo de Impostos para Imigrantes nos EUA — mockup 3D</title>
  <desc id="desc">Capa premium em grafite, bege e marfim da Express Solution, por Kelly Moraes.</desc>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#464443"/>
      <stop offset=".55" stop-color="#343332"/>
      <stop offset="1" stop-color="#242423"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171716"/>
      <stop offset=".5" stop-color="#31302f"/>
      <stop offset="1" stop-color="#181817"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f3ed"/>
      <stop offset=".6" stop-color="#e9e1d7"/>
      <stop offset="1" stop-color="#cfc4b8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c3aa"/>
      <stop offset=".5" stop-color="#a99683"/>
      <stop offset="1" stop-color="#eee4d9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-25%" width="180%" height="190%">
      <feDropShadow dx="28" dy="34" stdDeviation="28" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="portraitClip"><rect x="585" y="662" width="220" height="292" rx="28"/></clipPath>
  </defs>

  <ellipse cx="515" cy="1190" rx="335" ry="52" fill="#000" opacity=".2" filter="url(#soft)"/>

  <g filter="url(#shadow)" transform="rotate(-1.2 500 650)">
    <!-- page block and top edge -->
    <path d="M216 79 L858 102 L907 74 L272 50 Z" fill="url(#pages)"/>
    <path d="M855 102 L906 74 L905 1117 L855 1144 Z" fill="url(#pages)"/>
    <path d="M858 1115 L905 1088 L905 1117 L855 1144 Z" fill="#b8aa9c" opacity=".78"/>

    <!-- back/spine -->
    <path d="M124 104 Q132 73 168 68 L231 78 L231 1143 L164 1154 Q130 1155 123 1117 Z" fill="url(#spine)"/>
    <path d="M169 68 Q190 61 231 78 L231 1143 Q192 1155 164 1154 Q187 1139 188 1102 L188 123 Q187 86 169 68Z" fill="#111" opacity=".32"/>

    <!-- front cover -->
    <rect x="207" y="78" width="652" height="1066" rx="18" fill="url(#cover)" stroke="#5c5956" stroke-width="2"/>
    <rect x="219" y="90" width="628" height="1042" rx="14" fill="none" stroke="#fff" stroke-opacity=".045"/>

    <!-- subtle watermark -->
    <text x="648" y="392" fill="#f7f3ed" opacity=".035" font-family="Georgia,serif" font-weight="700" font-size="184">USA</text>
    <path d="M722 336 l15 31 34 5-25 24 6 34-30-16-30 16 6-34-25-24 34-5z" fill="#f7f3ed" opacity=".035"/>

    <!-- brand -->
    <g text-anchor="middle">
      <path d="M394 135 H684 M418 151 H660" stroke="#f7f3ed" stroke-width="3" opacity=".95"/>
      <text x="540" y="211" fill="#f7f3ed" font-family="Georgia,serif" font-style="italic" font-size="60">Express Solution</text>
      <path d="M433 231 H647 M450 247 H630" stroke="#ebe7e2" stroke-width="2" opacity=".85"/>
      <text x="540" y="276" fill="#ebe7e2" font-family="Arial,sans-serif" font-size="17" letter-spacing="2.5">TAX &amp; ACCOUNTING, INC.</text>
    </g>

    <!-- title -->
    <text x="272" y="380" fill="#f7f3ed" font-family="Georgia,serif" font-size="61" font-weight="700">
      <tspan x="272" dy="0">Guia Completo de</tspan>
      <tspan x="272" dy="70">Impostos para</tspan>
      <tspan x="272" dy="70">Imigrantes nos EUA</tspan>
    </text>
    <rect x="273" y="585" width="88" height="7" rx="3.5" fill="url(#gold)"/>
    <text x="274" y="635" fill="#ebe7e2" font-family="Arial,sans-serif" font-size="22">
      <tspan x="274" dy="0">Entenda o sistema, evite erros, aumente seu reembolso</tspan>
      <tspan x="274" dy="32">e organize sua vida financeira com segurança.</tspan>
    </text>

    <!-- feature stack -->
    <g font-family="Arial,sans-serif">
      <g transform="translate(278 735)">
        <circle cx="33" cy="33" r="33" fill="#ded3c6"/><text x="33" y="42" text-anchor="middle" fill="#343332" font-size="26" font-weight="700">01</text>
        <text x="83" y="27" fill="#f7f3ed" font-size="19" font-weight="700" letter-spacing="1.1">PASSO A PASSO</text><text x="83" y="52" fill="#c7c5c3" font-size="16">simplificado e direto</text>
      </g>
      <g transform="translate(278 825)">
        <circle cx="33" cy="33" r="33" fill="#ded3c6"/><text x="33" y="42" text-anchor="middle" fill="#343332" font-size="26" font-weight="700">02</text>
        <text x="83" y="27" fill="#f7f3ed" font-size="19" font-weight="700" letter-spacing="1.1">DICAS PRÁTICAS</text><text x="83" y="52" fill="#c7c5c3" font-size="16">e estratégias de organização</text>
      </g>
      <g transform="translate(278 915)">
        <circle cx="33" cy="33" r="33" fill="#ded3c6"/><text x="33" y="42" text-anchor="middle" fill="#343332" font-size="26" font-weight="700">03</text>
        <text x="83" y="27" fill="#f7f3ed" font-size="19" font-weight="700" letter-spacing="1.1">MAIS CLAREZA</text><text x="83" y="52" fill="#c7c5c3" font-size="16">para tomar decisões com segurança</text>
      </g>
    </g>

    <!-- author portrait card -->
    <rect x="573" y="650" width="244" height="316" rx="34" fill="#ebe7e2" stroke="#cbb8a4" stroke-width="3"/>
    <image x="585" y="662" width="220" height="292" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)" href="data:image/webp;base64,"/>

    <!-- author/footer -->
    <text x="274" y="1050" fill="#f7f3ed" font-family="Georgia,serif" font-size="43" font-weight="700">Kelly Moraes</text>
    <text x="274" y="1086" fill="#c7c5c3" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.8">EXPRESS SOLUTION TAX &amp; ACCOUNTING, INC.</text>

    <!-- spine copy -->
    <g transform="translate(156 1060) rotate(-90)">
      <text x="0" y="0" fill="#ebe7e2" font-family="Georgia,serif" font-size="26" font-weight="700">Guia Completo de Impostos para Imigrantes nos EUA</text>
    </g>
  </g>
</svg>